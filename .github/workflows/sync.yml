name: Download Instagram Stories to Dropbox

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'האם להוריד הכל מחדש (ללא בדיקת כפילויות)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      storage_backend:
        description: 'שם חיבור הענן (להרצה זו בלבד, עוקף את STORAGE_BACKEND.txt)'
        required: false
        default: ''
        type: string

concurrency:
  group: instagram-stories-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: הורדת הקוד של הריפו
        uses: actions/checkout@v4

      - name: התקנת Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: התקנת תלויות Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: התקנת דפדפן Chromium עבור Playwright
        run: playwright install --with-deps chromium

      - name: התקנת rclone
        run: curl -sSL https://rclone.org/install.sh | sudo bash

      - name: שחזור קובץ ה-state מהרצה הקודמת
        uses: actions/cache@v4
        with:
          path: state.json
          # Use a unique primary key per run to avoid restoring an old immutable cache
          key: state-json-cache-v1-${{ github.run_id }}
          # If exact key not found, restore the most recent cache that matches this prefix.
          # actions/cache will pick the latest created cache matching the restore-keys.
          restore-keys: |
            state-json-cache-v1-
            state-json-cache-v1

      - name: "Debug: state.json summary after restore"
        if: always()
        run: |
          if [ -f state.json ]; then
            python -c "import json; s=json.load(open('state.json')); users=s.get('uploaded_files',{}); total_entries=sum(len(v) for v in users.values()); pre_count=sum(1 for v in users.values() for e in v if e.get('pre_download_id')); print('state.exists=1'); print('tracked_users=', len(users)); print('total_entries=', total_entries); print('entries_with_pre_download_id=', pre_count)"
          else
            echo "state.exists=0"
          fi

      - name: שחזור קובץ תצורת rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        if: env.RCLONE_CONF != ''
        run: printf '%s' "$RCLONE_CONF" > rclone.conf

      - name: הרצת הסנכרון
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          STORAGE_BACKEND: ${{ github.event.inputs.storage_backend || '' }}
          FORCE_REDOWNLOAD: ${{ github.event.inputs.force_redownload || 'false' }}
          LOG_LEVEL: DEBUG
        run: |
          python -m src.main

      - name: שמירת קובץ ה-state המעודכן
        uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          # Save under a unique key per run
          key: state-json-cache-v1-${{ github.run_id }}
          restore-keys: |
            state-json-cache-v1-
            state-json-cache-v1

      - name: ניקוי קבצים זמניים
        if: always()
        run: |
          rm -rf stories

      - name: סיכום הרצה
        if: always()
        run: |
          echo "ההרצה הסתיימה. עיין בלוגים למעלה לפרטים נוספים."
