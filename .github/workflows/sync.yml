name: Download Instagram Stories to Dropbox

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_redownload:
        description: 'האם להוריד הכל מחדש (ללא בדיקת כפילויות)?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      storage_backend:
        description: 'שם חיבור הענן (להרצה זו בלבד, עוקף את STORAGE_BACKEND.txt)'
        required: false
        default: ''
        type: string

concurrency:
  group: instagram-stories-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: הורדת הקוד של הריפו
        uses: actions/checkout@v4

      - name: התקנת Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: התקנת תלויות Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: התקנת דפדפן Chromium עבור Playwright
        run: playwright install --with-deps chromium

      - name: התקנת rclone
        run: curl -sSL https://rclone.org/install.sh | sudo bash

      - name: שחזור קובץ תצורת rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        if: env.RCLONE_CONF != ''
        run: printf '%s' "$RCLONE_CONF" > rclone.conf

      - name: Resolve remote backend for stories and state persistence
        id: resolve-remote
        env:
          STORAGE_BACKEND: ${{ github.event.inputs.storage_backend || '' }}
        run: |
          set -euo pipefail
          requested="$(printf '%s' "$STORAGE_BACKEND" | tr -d '\r')"
          if [ -z "$requested" ] && [ -f STORAGE_BACKEND.txt ]; then
            requested="$(tr -d '\r\n' < STORAGE_BACKEND.txt | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          fi

          if [ ! -f rclone.conf ]; then
            if [ -n "$requested" ]; then
              echo 'error: STORAGE_BACKEND configured but rclone.conf is missing' >&2
            else
              echo 'error: no STORAGE_BACKEND configured and rclone.conf is missing' >&2
            fi
            exit 1
          fi

          remotes=$(grep -E '^\[.*\]$' rclone.conf | sed -E 's/^\[(.*)\]$/\1/' | tr -d '\r')
          if [ -z "$remotes" ]; then
            echo 'error: no remotes found in rclone.conf' >&2
            exit 1
          fi

          if [ -z "$requested" ]; then
            echo 'error: no STORAGE_BACKEND configured' >&2
            echo "available remotes: $remotes" >&2
            exit 1
          fi

          if ! printf '%s\n' "$remotes" | grep -Fxq "$requested"; then
            echo "error: requested storage backend '$requested' not found in rclone.conf" >&2
            echo "available remotes: $remotes" >&2
            exit 1
          fi

          echo "remote=$requested" >> "$GITHUB_OUTPUT"

      - name: שחזור state.json מה־remote אם קיים
        run: |
          set -e
          remote="${{ steps.resolve-remote.outputs.remote }}"
          if [ ! -f rclone.conf ]; then
            echo 'rclone.conf is missing' >&2
            exit 1
          fi
          if ! rclone listremotes --config rclone.conf | grep -Fxq "${remote}:"; then
            echo "Could not access remote '${remote}' via rclone" >&2
            exit 1
          fi
          if ! rclone lsd "${remote}:" --config rclone.conf >/dev/null 2>&1; then
            echo "Remote '${remote}' is configured but not accessible via rclone" >&2
            exit 1
          fi
          if rclone lsjson "${remote}:.instagram-sync/state.json" --config rclone.conf >/dev/null 2>&1; then
            rclone copyto "${remote}:.instagram-sync/state.json" state.json --config rclone.conf
            echo "Restored state.json from ${remote}:.instagram-sync/state.json"
          else
            echo "Remote state.json not found; starting fresh"
          fi

      - name: Validate restored state.json if present
        run: |
          if [ ! -f state.json ]; then
            echo 'No state.json restored; starting fresh'
            exit 0
          fi
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path('state.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'Invalid JSON in restored state.json: {exc}', file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print('restored state.json root must be a JSON object', file=sys.stderr)
              sys.exit(1)
          if not isinstance(data.get('version'), int):
              print('restored state.json.version must be an integer', file=sys.stderr)
              sys.exit(1)
          if 'uploaded_files' not in data or not isinstance(data['uploaded_files'], dict):
              print('restored state.json.uploaded_files must be an object', file=sys.stderr)
              sys.exit(1)

          for username, entries in data['uploaded_files'].items():
              if not isinstance(username, str):
                  print('restored state.json.uploaded_files keys must be strings', file=sys.stderr)
                  sys.exit(1)
              if not isinstance(entries, list):
                  print(f'restored uploaded_files[{username}] must be a list', file=sys.stderr)
                  sys.exit(1)
              for entry in entries:
                  if not isinstance(entry, dict):
                      print('Each restored uploaded entry must be an object', file=sys.stderr)
                      sys.exit(1)
                  if 'filename' not in entry or 'dropbox_path' not in entry:
                      print('Each restored upload entry must contain filename and dropbox_path', file=sys.stderr)
                      sys.exit(1)
                  if not isinstance(entry['filename'], str) or not isinstance(entry['dropbox_path'], str):
                      print('restored filename and dropbox_path must be strings', file=sys.stderr)
                      sys.exit(1)
                  if 'instagram_id' not in entry and 'pre_download_id' not in entry:
                      print('Each restored entry must include instagram_id or pre_download_id', file=sys.stderr)
                      sys.exit(1)
          PY

      - name: "Debug: state.json summary after restore"
        run: |
          if [ -f state.json ]; then
            python -c "import json; s=json.load(open('state.json')); users=s.get('uploaded_files',{}); total_entries=sum(len(v) for v in users.values()); pre_count=sum(1 for v in users.values() for e in v if e.get('pre_download_id')); print('state.exists=1'); print('tracked_users=', len(users)); print('total_entries=', total_entries); print('entries_with_pre_download_id=', pre_count)"
          else
            echo "state.exists=0"
          fi

      - name: הרצת הסנכרון
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          STORAGE_BACKEND: ${{ github.event.inputs.storage_backend || '' }}
          FORCE_REDOWNLOAD: ${{ github.event.inputs.force_redownload || 'false' }}
          LOG_LEVEL: DEBUG
        run: |
          python -m src.main

      - name: Validate and upload local state.json to remote
        if: ${{ always() && steps.resolve-remote.outcome == 'success' }}
        run: |
          set -e
          remote="${{ steps.resolve-remote.outputs.remote }}"
          if [ ! -f state.json ]; then
            echo 'No local state.json to upload'
            exit 0
          fi
          python - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path('state.json')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except Exception as exc:
              print(f'Invalid JSON in state.json: {exc}', file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print('state.json root must be a JSON object', file=sys.stderr)
              sys.exit(1)
          if not isinstance(data.get('version'), int):
              print('state.json.version must be an integer', file=sys.stderr)
              sys.exit(1)
          if 'uploaded_files' not in data or not isinstance(data['uploaded_files'], dict):
              print('state.json.uploaded_files must be an object', file=sys.stderr)
              sys.exit(1)

          for username, entries in data['uploaded_files'].items():
              if not isinstance(username, str):
                  print('state.json.uploaded_files keys must be strings', file=sys.stderr)
                  sys.exit(1)
              if not isinstance(entries, list):
                  print(f'uploaded_files[{username}] must be a list', file=sys.stderr)
                  sys.exit(1)
              for entry in entries:
                  if not isinstance(entry, dict):
                      print('Each uploaded entry must be an object', file=sys.stderr)
                      sys.exit(1)
                  if 'filename' not in entry or 'dropbox_path' not in entry:
                      print('Each upload entry must contain filename and dropbox_path', file=sys.stderr)
                      sys.exit(1)
                  if not isinstance(entry['filename'], str) or not isinstance(entry['dropbox_path'], str):
                      print('filename and dropbox_path must be strings', file=sys.stderr)
                      sys.exit(1)
                  if 'instagram_id' not in entry and 'pre_download_id' not in entry:
                      print('Each entry must include instagram_id or pre_download_id', file=sys.stderr)
                      sys.exit(1)
          PY
          rclone mkdir "${remote}:.instagram-sync" --config rclone.conf
          rclone copyto state.json "${remote}:.instagram-sync/state.json" --config rclone.conf
          echo "Uploaded state.json to ${remote}:.instagram-sync/state.json"

      - name: ניקוי קבצים זמניים
        if: always()
        run: |
          rm -rf stories

      - name: סיכום הרצה
        if: always()
        run: |
          echo "ההרצה הסתיימה. עיין בלוגים למעלה לפרטים נוספים."
