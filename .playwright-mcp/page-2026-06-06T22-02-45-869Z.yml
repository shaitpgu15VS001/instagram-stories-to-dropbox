          - generic [ref=e150]: Of course, by all means. As an online service, FastDl works directly in your browser. Using this Instagram Story Viewer for your PC will not be a problem. Our stories downloader service is also available for tablets, Macs, and phones. Our photo downloading service is also available for tablets or phones.
        - listitem [ref=e151]:
          - heading "What type of file formats does FastDl support for downloading?" [level=3] [ref=e152]
